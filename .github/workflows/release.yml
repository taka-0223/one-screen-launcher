name: Build and Release One Screen

on:
  push:
    branches: [ "main" ]
    paths:
      - "build-request.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: taka-0223/one-screen-launcher-archive
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          mkdir -p src/dev-signing
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > src/dev-signing/one-screen-dev.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build
        working-directory: src
        run: |
          gradle :app:testDebugUnitTest
          gradle :app:assembleDebug

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' src/app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk one-screen-launcher.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" one-screen-launcher.apk --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" one-screen-launcher.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "One Screen Launcher $TAG"
          fi
